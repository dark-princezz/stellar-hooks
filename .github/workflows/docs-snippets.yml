name: Check documentation snippets

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/check-snippets.mjs"
      - "tsconfig.json"
      - ".github/workflows/docs-snippets.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/check-snippets.mjs"
      - "tsconfig.json"
      - ".github/workflows/docs-snippets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-snippets:
    name: Type-check documented snippets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check snippets
        run: npm run check:snippets
