name: Futurenet integration

# Opt-in live network tests — not part of the default CI gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  futurenet:
    name: Futurenet live integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Futurenet integration tests
        run: npm run test:futurenet
