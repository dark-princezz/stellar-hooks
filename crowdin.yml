# Crowdin configuration. Project id and token come from the environment:
#   CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true
files:
  - source: /README.md
    translation: /docs/i18n/%two_letters_code%/README.md
  - source: /docs/getting-started.md
    translation: /docs/i18n/%two_letters_code%/getting-started.md
