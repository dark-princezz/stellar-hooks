<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Multisig Transaction Signing Flow</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; }
      .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
      .header { text-align: center; margin-bottom: 40px; }
      .header h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .header p { color: #94a3b8; font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
      .card { background: #1e293b; border-radius: 16px; padding: 30px; border: 1px solid #334155; margin-bottom: 24px; }
      .card h2 { margin-bottom: 15px; color: #e2e8f0; font-size: 1.5rem; }
      .card p { color: #94a3b8; margin-bottom: 20px; line-height: 1.6; }
      .btn { display: inline-block; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; font-size: 1rem; }
      .btn-primary { background: #6366f1; color: white; }
      .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
      .btn-primary:disabled { background: #475569; cursor: not-allowed; transform: none; }
      .btn-secondary { background: #475569; color: white; margin-left: 10px; }
      .btn-secondary:hover { background: #334155; }
      .btn-small { padding: 8px 16px; font-size: 0.9rem; }
      .btn-success { background: #22c55e; color: white; }
      .btn-success:hover { background: #16a34a; }
      .btn-outline { background: transparent; border: 2px solid #6366f1; color: #6366f1; }
      .btn-outline:hover { background: rgba(99, 102, 241, 0.1); }
      .form-group { margin-bottom: 16px; }
      .label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 0.875rem; font-weight: 500; }
      .input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 1rem; box-sizing: border-box; }
      .input:focus { outline: none; border-color: #6366f1; }
      .input:disabled { opacity: 0.5; }
      .status-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
      .status-pending { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }
      .status-signed { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
      .status-complete { background: rgba(99, 102, 241, 0.1); color: #6366f1; }
      .signer-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 16px; }
      .signer-card h3 { margin-bottom: 10px; color: #e2e8f0; display: flex; align-items: center; gap: 8px; }
      .signer-card h3 .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
      .signer-card .avatar.A { background: #6366f1; }
      .signer-card .avatar.B { background: #8b5cf6; }
      .signer-card .avatar.C { background: #ec4899; }
      .signer-card .avatar.D { background: #10b981; }
      .signer-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
      .signer-address { font-family: 'Consolas', 'Monaco', monospace; color: #4ade80; font-size: 0.9rem; word-break: break-all; }
      .signer-status { display: flex; align-items: center; gap: 8px; }
      .signer-status .indicator { width: 10px; height: 10px; border-radius: 50%; }
      .indicator.pending { background: #fbbf24; }
      .indicator.signed { background: #22c55e; }
      .threshold-meter { background: #334155; border-radius: 6px; height: 12px; margin: 12px 0; overflow: hidden; position: relative; }
      .threshold-fill { background: linear-gradient(90deg, #6366f1, #8b5cf6); height: 100%; transition: width 0.3s ease; }
      .threshold-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; }
      .threshold-value { color: #e2e8f0; font-weight: 600; }
      .signature-list { margin-top: 16px; }
      .signature-list h4 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px; }
      .sig-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; font-family: monospace; }
      .sig-item .check { color: #22c55e; }
      .sig-item .user { color: #6366f1; }
      .sig-item .weight { color: #8b5cf6; }
      .step-badge { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; background: #334155; color: #94a3b8; margin-right: 12px; }
      .step-badge.active { background: #6366f1; color: white; }
      .step-badge.completed { background: #22c55e; color: white; }
      .step-row { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #334155; }
      .step-info { flex: 1; }
      .step-title { color: #e2e8f0; font-size: 1rem; margin-bottom: 4px; }
      .step-desc { color: #94a3b8; font-size: 0.875rem; }
      .step-status { display: flex; align-items: center; gap: 8px; }
      .operation-card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
      .operation-card h4 { color: #e2e8f0; margin-bottom: 8px; font-size: 0.9rem; }
      .operation-details { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.85rem; }
      .op-detail span { color: #94a3b8; margin-right: 4px; }
      .op-detail code { color: #4ade80; font-family: monospace; }
      .connection-status { display: flex; align-items: center; gap: 12px; }
      .wallet-btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
      .wallet-btn.connected { background: #22c55e; color: white; }
      .wallet-btn.disconnected { background: #475569; color: white; }
      .wallet-btn.loading { opacity: 0.7; }
      .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
      .alert-error { background: rgba(248, 113, 113, 0.1); border-left: 4px solid #f87171; color: #fca5a5; }
      .alert-success { background: rgba(34, 197, 94, 0.1); border-left: 4px solid #22c55e; color: #86efac; }
      .alert-info { background: rgba(99, 102, 241, 0.1); border-left: 4px solid #6366f1; color: #c7d2fe; }
      .alert-warning { background: rgba(251, 191, 36, 0.1); border-left: 4px solid #fbbf24; color: #fcd34d; }
      .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .status-label { color: #94a3b8; font-size: 0.875rem; min-width: 100px; }
      .status-value { color: #e2e8f0; font-size: 1rem; }
      .hash-display { font-family: 'Consolas', 'Monaco', monospace; color: #4ade80; word-break: break-all; font-size: 0.85rem; }
      .footer { text-align: center; margin-top: 40px; padding: 20px; color: #64748b; font-size: 0.9rem; }
      .footer a { color: #6366f1; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🔐 Stellar Multisig Signing Flow</h1>
        <p>Collect multiple signatures for a transaction before submission</p>
      </div>

      <div id="root"></div>

      <footer class="footer">
        <p>Built with <a href="https://github.com/dark-princezz/stellar-hooks" style="color: #6366f1;">stellar-hooks</a></p>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
